# One line in CHANGELOG.md for every PR merged to master.
# The PR title is the line. Add [skip changelog] to the title to omit.
name: Changelog

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: changelog-master
  cancel-in-progress: false

jobs:
  update:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepend merged PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_changelog.py --add

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog change"
            exit 0
          fi
          git commit -m "changelog: #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Failed to push changelog" >&2
          exit 1
